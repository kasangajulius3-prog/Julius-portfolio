<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Outer Pillar/Temple Pediment & Geometric Frame -->
  <defs>
    <linearGradient id="stoicGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#d4d4d8"/>
      <stop offset="100%" stop-color="#71717a"/>
    </linearGradient>
  </defs>
  
  <!-- Outer Diamond Guard -->
  <polygon points="50,6 94,50 50,94 6,50" fill="none" stroke="url(#stoicGrad)" stroke-width="2.5" stroke-linejoin="round"/>
  
  <!-- Stoic Column / Pediment Architecture -->
  <!-- Roof / Pediment Triangle -->
  <polygon points="50,22 74,36 26,36" fill="url(#stoicGrad)" opacity="0.95"/>
  <rect x="23" y="38" width="54" height="4" rx="1" fill="#ffffff"/>
  
  <!-- Pillars (Strength, Wisdom, Temperance, Justice) -->
  <rect x="28" y="44" width="7" height="26" rx="1.5" fill="#f4f4f5"/>
  <rect x="41" y="44" width="7" height="26" rx="1.5" fill="#e4e4e7"/>
  <rect x="53" y="44" width="7" height="26" rx="1.5" fill="#e4e4e7"/>
  <rect x="65" y="44" width="7" height="26" rx="1.5" fill="#f4f4f5"/>
  
  <!-- Base -->
  <rect x="23" y="72" width="54" height="4" rx="1" fill="#e4e4e7"/>
  <rect x="20" y="77" width="60" height="5" rx="1.5" fill="#ffffff"/>
</svg>